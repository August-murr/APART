# Safety valve for the Optimizer's unattended runs. Enforced by sealed/cost.py,
# which reads cumulative spend from OpenRouter's /api/v1/key endpoint and halts
# past the cap. The key is pay-as-you-go with no ceiling of its own, so this is
# the only backstop against a runaway loop.

max_total_usd: 6.0 # raised from 4.0 for Phase 3 co-evolution smoke runs
max_iterations: 300
